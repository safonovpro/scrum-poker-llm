version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scrum_poker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scrum_poker_password}
      POSTGRES_DB: ${POSTGRES_DB:-scrum_poker}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scrum_poker}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      FLASK_APP: app
      FLASK_ENV: production
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-here}
      DATABASE_URL: postgresql://${POSTGRES_USER:-scrum_poker}:${POSTGRES_PASSWORD:-scrum_poker_password}@db:5432/${POSTGRES_DB:-scrum_poker}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:

