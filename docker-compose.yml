version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scrum_poker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scrum_poker_password}
      POSTGRES_DB: ${POSTGRES_DB:-scrum_poker}
    volumes:
      - .podman/pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scrum_poker}"]
      interval: 5s
      timeout: 5s
      retries: 5
